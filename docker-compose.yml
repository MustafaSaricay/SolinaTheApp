version: "3.9"

services:
  # ── PostgreSQL + TimescaleDB ─────────────────────────────────────────────────
  db:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB:       solina
      POSTGRES_USER:     solina
      POSTGRES_PASSWORD: solina
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solina -d solina"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Node.js / Express backend ────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT:                    3000
      DATABASE_URL:            postgresql://solina:solina@db:5432/solina
      POLL_INTERVAL_SECONDS:   300
      CORS_ORIGIN:             "*"
      NODE_ENV:                production
    ports:
      - "3000:3000"
    volumes:
      # Mount source for development hot-reload (remove in production)
      - ./backend/src:/app/src:ro

volumes:
  db_data:
